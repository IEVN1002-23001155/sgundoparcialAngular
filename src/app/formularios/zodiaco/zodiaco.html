<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
          <div style="display: flex; justify-content: center; margin-top: 50px;">
    <div style="display: flex; width: 750px; border: 2px solid #333; padding: 15px; background-color: #fafafa;">
        
        <div style="width: 55%; padding-right: 15px; border-right: 1px dashed #666;">
            <h3>Formulario de Registro</h3>
            <br>
            <label>Nombre(s):</label><br>
            <input type="text" [(ngModel)]="nombreUsr" style="width: 90%; margin-bottom: 8px;"><br>

            <label>Apellido Paterno:</label><br>
            <input type="text" [(ngModel)]="pat" style="width: 90%; margin-bottom: 8px;"><br>

            <label>Apellido Materno:</label><br>
            <input type="text" [(ngModel)]="mat" style="width: 90%; margin-bottom: 12px;"><br>

            <label>Fecha de Nacimiento:</label>
            <div style="display: flex; gap: 5px; margin-top: 5px; margin-bottom: 12px;">
                <input type="text" [(ngModel)]="d" placeholder="Día" style="width: 40px;">
                <input type="text" [(ngModel)]="m" placeholder="Mes" style="width: 40px;">
                <input type="text" [(ngModel)]="a" placeholder="Año" style="width: 60px;">
            </div>

            <label>Sexo:</label><br>
            <input type="radio" name="genero" value="M" [(ngModel)]="genero"> Masculino 
            <input type="radio" name="genero" value="F" [(ngModel)]="genero"> Femenino
            <br><br>

            <button (click)="calcularSigno()" style="padding: 8px 20px; background: #000000; color: #fff; cursor: pointer; border: none;">
                Enviar datos
            </button>
        </div>
        
        <!-- Lado derecho: Resultados -->
        <div style="width: 45%; padding-left: 20px; text-align: center;">
            <h3>Resultado</h3>
            <hr style="margin-bottom: 20px;">

            <div >
                <p><b>Nombre:</b> {{completo}}</p>
                <p><b>Edad:</b> {{anios}} años</p>
                <p><b>Signo Chino:</b> {{animal}}</p>
                
                <div style="margin-top: 15px;">
                    <img [src]="foto" [width]="tamanioImg" alt="icono">
                </div>
            </div>
        </div>

    </div>
</div>


</body>
</html>
