<div class="max-w-2xl mx-auto p-6 bg-white rounded-lg shadow">
  
  <h1 class="text-3xl font-bold text-gray-900 mb-6">
    Lista Alumnos
  </h1>
 
  <form [formGroup]="contactForm">
 
    <!-- 1. Matrícula -->
    <div class="mb-5">
      <label for="matricula" class="block mb-2 text-sm font-medium text-gray-900">
        Matrícula
      </label>
      <input
        type="text"
        id="matricula"
        formControlName="matricula"
        required
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Ingresa la matrícula"
      >
    </div>

    <!-- 2. Nombre -->
    <div class="mb-5">
      <label for="nombre" class="block mb-2 text-sm font-medium text-gray-900">
        Nombre
      </label>
      <input
        type="text"
        id="nombre"
        formControlName="nombre"
        required
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Ingresa el nombre completo"
      >
    </div>
 
    <!-- 3. Correo -->
    <div class="mb-5">
      <label for="correo" class="block mb-2 text-sm font-medium text-gray-900">
        Correo Electrónico
      </label>
      <input
        type="email"
        id="correo"
        formControlName="correo"
        required
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="correo@ejemplo.com"
      >
    </div>

    <!-- 4. Materia -->
    <div class="mb-5">
      <label for="materia" class="block mb-2 text-sm font-medium text-gray-900">
        Materia
      </label>
      <input
        type="text"
        id="materia"
        formControlName="materia"
        required
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Ingresa la materia"
      >
    </div>
 
    <!-- Botón de Envío -->
    <div class="flex justify-end mt-5">
      <button
        type="submit"
        [disabled]="contactForm.invalid"
        class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 disabled:opacity-50 disabled:cursor-not-allowed"
      >
        Guardar Alumno
      </button>
    </div>
 
  </form>
 
</div>
